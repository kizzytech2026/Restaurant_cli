[pytest]
# Directs pytest to look for tests inside the tests directory
testpaths = tests

# Configures Python path so modules can be imported directly without import errors
pythonpath = .

# Default command-line options when running `pytest`
# -v: verbose output
# -ra: show extra summary info for all test results except passed
addopts = -v -ra

# Naming patterns for test files and functions
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*